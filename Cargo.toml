[workspace]
resolver = "2"
members = [
    "programs/registry",
    "programs/census",
    "programs/pocket",
    "programs/verifier",
    "programs/cpi-caller",
    "programs/itests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
