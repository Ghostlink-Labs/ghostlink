[package]
name = "ghostlink-itests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Integration tests: the three compiled programs running under LiteSVM through every flow in the build plan. Deliberately depends on no program crate — instructions are rebuilt from raw bytes so any drift between stacks fails loudly."

[dependencies]

[dev-dependencies]
# No solana-keypair: 3.1.2 fails to build against five8 1.0 (upstream
# FromStr breakage) and 4.0 wants a Signer trait the transaction crate
# does not. tests use a local ed25519-dalek signer instead.
ed25519-dalek = "2"
litesvm = { version = "0.18", features = ["precompiles"] }
solana-account = "4"
solana-clock = "3"
solana-instruction = "3"
solana-message = "4"
solana-pubkey = "3"
solana-rent = "4"
solana-signature = "3"
solana-signer = "3"
solana-transaction = "4"
ghostlink-verifier = { path = "../verifier" }
borsh = "1"
sha2 = "0.10"
serde_json = "1"
num-bigint = "0.4"
bs58 = "0.5"
p256 = { version = "0.13", features = ["ecdsa"] }
