[package]
name = "ghostlink-verifier"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Groth16 verification, Poseidon helpers and shared encodings for the GhostLink programs. A library linked into registry and pocket, never a program of its own, so there is no cross-program trust boundary around proof checks."

[dependencies]
# Pinned to the reviewed rev: the crates.io 0.2.0 release predates the
# circom-vk generator and the negate helpers this repo relies on.
groth16-solana = { git = "https://github.com/Lightprotocol/groth16-solana.git", rev = "ac9d959f9b14479c20c9d4f8168fa4cc47c13071", default-features = false }
solana-poseidon = "3.0"

[dev-dependencies]
serde_json = "1"
num-bigint = "0.4"
sha2 = "0.10"

[features]
default = []
circom-vk = ["groth16-solana/circom-vk"]

[[bin]]
name = "gen-vk"
path = "src/bin/gen_vk.rs"
required-features = ["circom-vk"]
